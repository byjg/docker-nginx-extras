name: Docker

on:
  push:
    branches: [ master ]
    tags: [ '*.*.*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      push:
        description: 'Push image to registry'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  # Intentionally explicit. The guideline derives byjg/<name> from the repository
  # name without the docker- prefix, which gives exactly this value.
  IMAGE_NAME: byjg/nginx-extras

jobs:
  Build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry
        if: github.event_name == 'push' || github.event.inputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Read the nginx version from the Dockerfile
        id: nginx
        run: |
          set -euo pipefail
          version=$(grep -E '^ENV[[:space:]]+NGINX_VERSION[[:space:]=]' Dockerfile | head -n1 \
            | sed -E 's/^ENV[[:space:]]+NGINX_VERSION[[:space:]=]+//' | tr -d '"')
          if [ -z "$version" ]; then
            echo "FAIL: could not read NGINX_VERSION from the Dockerfile"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$version" | cut -d. -f-2)" >> "$GITHUB_OUTPUT"

      # amd64 only, kept locally. The multi-arch build below reuses these layers
      # from the builder cache, so amd64 is compiled once.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:test

      - name: Test the image
        run: |
          set -euo pipefail
          IMAGE="${{ env.IMAGE_NAME }}:test"

          echo "--- nginx reports the version the Dockerfile declares ---"
          REPORTED=$(docker run --rm "$IMAGE" nginx -v 2>&1 | sed -E 's#.*nginx/([0-9.]+).*#\1#')
          echo "nginx -v: $REPORTED / Dockerfile: ${{ steps.nginx.outputs.version }}"
          if [ "$REPORTED" != "${{ steps.nginx.outputs.version }}" ]; then
            echo "FAIL: version mismatch"
            exit 1
          fi

          echo "--- compiled modules ---"
          docker run --rm "$IMAGE" sh -c "nginx -V 2>&1 | tr ' ' '\n' | grep module"

          echo "--- the container serves HTTP ---"
          CID=$(docker run -d -p 8080:80 "$IMAGE")
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ >/dev/null 2>&1; then
              break
            fi
            if [ "$i" = 30 ]; then
              echo "FAIL: the server never became ready"
              docker logs "$CID"
              exit 1
            fi
            sleep 1
          done
          # -f already fails on any non-2xx, so this checks the status and the body.
          curl -fsS http://localhost:8080/ | grep -qi "welcome to nginx"
          echo "200, default page served"
          docker rm -f "$CID" >/dev/null

          # Every bundled module is exercised, not just listed: a module that
          # compiles against this nginx but misbehaves at runtime fails here.
          echo "--- every module actually works ---"
          mkdir -p /tmp/site/subs /tmp/site/idx
          echo "<p>PLACEHOLDER</p>" > /tmp/site/subs/index.html
          echo alpha > /tmp/site/idx/alpha.txt
          cat > /tmp/modules.conf <<'CONF'
          load_module /etc/nginx/modules/ngx_otel_module.so;
          events {}
          http {
              otel_exporter { endpoint localhost:4317; }
              server {
                  listen 80;
                  root /site;
                  location = /hdr { more_set_headers "X-Mod-Test: ok"; return 200 "ok\n"; }
                  location /subs/ { subs_filter PLACEHOLDER substituted; otel_trace on; }
                  location /idx/  { fancyindex on; }
              }
          }
          CONF
          CID=$(docker run -d -p 8081:80 \
            -v /tmp/modules.conf:/etc/nginx/nginx.conf:ro \
            -v /tmp/site:/site:ro "$IMAGE")
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8081/hdr >/dev/null 2>&1; then
              break
            fi
            if [ "$i" = 30 ]; then
              echo "FAIL: the module test server never became ready"
              docker logs "$CID"
              exit 1
            fi
            sleep 1
          done
          curl -fsSI http://localhost:8081/hdr | grep -qi "X-Mod-Test: ok"
          echo "ok: headers-more sets response headers"
          curl -fsS http://localhost:8081/subs/index.html | grep -q substituted
          echo "ok: subs_filter rewrites the body"
          curl -fsS http://localhost:8081/idx/ | grep -qi "index of"
          echo "ok: fancyindex generates a listing"
          # nginx started at all, so load_module plus the otel_* directives above
          # were accepted by the module compiled for this exact nginx version.
          echo "ok: otel module loaded and its directives are valid"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}

      # master/main -> latest plus the nginx <major>.<minor>; a release tag -> the
      # tag itself. A branch name must never reach the registry.
      - name: Normalize the tags
        id: normalized
        uses: actions/github-script@v9
        env:
          REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          NGINX_MINOR: ${{ steps.nginx.outputs.minor }}
        with:
          script: |
            const prefix = process.env.REGISTRY ? `${process.env.REGISTRY}/` : '';
            const image = `${prefix}${process.env.IMAGE_NAME}`;
            const tags = `${{ join(steps.meta.outputs.tags, ',') }}`;
            const result = [];
            // metadata-action emits one tag per line, and join() above uses
            // commas, so accept either separator.
            tags.split(/[\n,]/).forEach(function (item) {
              const trimmed = item.trim();
              if (!trimmed) {
                return;
              }
              const short_tag = trimmed.split(":").pop();
              if (short_tag == "master" || short_tag == "main") {
                result.push(`${image}:latest`);
                result.push(`${image}:${process.env.NGINX_MINOR}`);
              } else if (short_tag != "latest") {
                result.push(`${image}:${short_tag}`);
              }
            });
            return result.join(",");
          result-encoding: string

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || github.event.inputs.push == 'true' }}
          tags: ${{ steps.normalized.outputs.result }}
          labels: ${{ steps.meta.outputs.labels }}

  Documentation:
    if: github.ref == 'refs/heads/master'
    needs: Build
    uses: byjg/byjg.github.io/.github/workflows/add-doc.yaml@master
    with:
      folder: devops
      project: ${{ github.event.repository.name }}
    secrets:
      DOC_TOKEN: ${{ secrets.DOC_TOKEN }}
